name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-build:
    name: API build and database migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install API dependencies
        run: npm ci
      - name: Generate Prisma Client
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate
      - name: Apply database migrations
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npm run prisma:deploy
      - name: Create least-privilege runtime test role
        env:
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          node --input-type=module <<'NODE'
          import { Pool } from "pg";

          const pool = new Pool({ connectionString: process.env.DIRECT_URL });
          try {
            await pool.query(`
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'cms_runtime') THEN
                  CREATE ROLE cms_runtime LOGIN PASSWORD 'runtime-ci';
                END IF;
              END
              $$;
            `);
            await pool.query("GRANT USAGE ON SCHEMA public TO cms_runtime");
            await pool.query(
              'GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE public."cms_login_rate_limits" TO cms_runtime',
            );
          } finally {
            await pool.end();
          }
          NODE
      - name: Build API
        run: npm run build
      - name: Run API tests
        env:
          DATABASE_URL: postgresql://cms_runtime:runtime-ci@localhost:5432/ci
          RUN_DATABASE_INTEGRATION_TESTS: "true"
        run: npm test

  admin-build:
    name: Admin build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install Admin dependencies
        run: npm ci
      - name: Build Admin
        run: npm run build

  site-build:
    name: Site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install Site dependencies
        run: npm ci
      - name: Build Site
        run: npm run build

  generic-playwright-tests:
    name: Generic Playwright browser tests (playwright.dev)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root test dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run generic browser tests
        run: npx playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: generic-playwright-report
          path: playwright-report/
          retention-days: 14
